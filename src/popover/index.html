<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file:; frame-src 'self' file:" />
  <link rel="stylesheet" href="popover.css" />
  <title>Meanwaile</title>
</head>
<body>
  <div id="root">
    <div id="header">
      <div id="header-left">
        <button id="back-btn" aria-label="Back to Meanwaile" hidden>‹</button>
        <span id="brand">meanwaile</span>
        <span id="game-name" hidden></span>
      </div>
      <div id="header-right">
        <button id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="header-menu" aria-label="More options">···</button>
        <div id="header-menu" role="menu" aria-label="More options" hidden>
          <button id="gallery-btn" role="menuitem">Add game</button>
          <button id="settings-btn" role="menuitem">Settings</button>
        </div>
      </div>
    </div>

    <div id="tabs" role="tablist" aria-label="Views">
      <button id="tab-games" role="tab" aria-selected="true" aria-controls="hub-screen">Games</button>
      <button id="tab-agents" role="tab" aria-selected="false" aria-controls="agents-screen" tabindex="-1">Agents</button>
    </div>

    <div id="hub-screen" role="tabpanel" aria-labelledby="tab-games"></div>

    <div id="agents-screen" role="tabpanel" aria-labelledby="tab-agents" hidden></div>

    <div id="game-screen" hidden>
      <div id="game-area">
        <!--
          allow-same-origin is required alongside allow-scripts: games load
          via file:// and use <script type="module">, and Chromium refuses
          to fetch module scripts from an opaque origin (what allow-scripts
          alone produces). The isolation this pair usually gives up - CSP
          bypass via document.domain tricks - doesn't apply here since each
          game already gets its own per-bundle CSP (see injectGameCsp in
          src/game-installer.ts) that isn't controlled by sandbox flags.
          Top navigation, popups, forms, and modals stay blocked regardless.
        -->
        <iframe id="game" sandbox="allow-scripts allow-same-origin"></iframe>
        <div id="overlay">
          <p id="overlay-msg">Ready to play?</p>
          <button id="continue-btn">Start</button>
        </div>
      </div>
      <div id="placeholder" hidden>
        <div id="placeholder-icon"></div>
        <p id="placeholder-title">Próximamente</p>
        <p id="placeholder-text"></p>
      </div>
    </div>
  </div>
  <script type="module" src="popover.js"></script>
</body>
</html>
